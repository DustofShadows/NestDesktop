[package]
name = "nest-desktop"
version = "0.2.11"
edition = "2021"
description = "Android-inspired app folders for the Windows desktop"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Foundation_Numerics",
  "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi",
  "Win32_UI_Shell_Common",
  "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Ole"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
